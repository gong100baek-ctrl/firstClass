<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀뚜라미리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="warp">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                         <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="방방난방시스템" class="PC">
                            <img src="img/m_visual01.png" alt="모바일 방방난방시스템" class="Mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="따숨케어"
                            class="PC">
                            <img src="img/m_visual02.png" alt="모바일 따숨케어"
                            class="Mo">
                        </div>
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- If we need scrollbar -->
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiper = new swiper('.hero-sec > .swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,

            // If we need pagination
            pagination: {
                el: '.visual .swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
        });
    </script>
</body>
</html>
