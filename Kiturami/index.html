<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀뚜라미리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="header">
            <div class="header-inner">
                <h1 class="logo">
                    <a href="index.html" aria-label="귀뚜라미 홈">
                        <span class="logo-en">Kiturami</span>
                        <span class="logo-ko">귀뚜라미</span>
                    </a>
                </h1>

                <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-navigation">
                    <span></span><span></span><span></span>
                </button>

                <nav class="gnb" id="site-navigation" aria-label="주요 메뉴">
                    <ul>
                        <li class="gnb-item">
                            <a href="#" aria-expanded="false" aria-controls="submenu-company">회사소개</a>
                        </li>
                        <li class="gnb-item">
                            <a href="#" aria-expanded="false" aria-controls="submenu-products">제품소개</a>
                        </li>
                        <li class="gnb-item">
                            <a href="#" aria-expanded="false" aria-controls="submenu-pr">홍보센터</a>
                        </li>
                        <li class="gnb-item">
                            <a href="#" aria-expanded="false" aria-controls="submenu-support">고객센터</a>
                        </li>
                        <li class="gnb-item gnb-shop">
                            <a href="https://krb.co.kr/" target="_blank" rel="noopener noreferrer">귀뚜라미몰 바로가기</a>
                        </li>
                    </ul>
                </nav>

                <div class="mega-menu" id="header-mega-menu" aria-label="회사소개 하위 메뉴">
                    <nav class="mega-menu-inner" aria-label="회사소개 메뉴">
                        <a href="https://krb.co.kr/">기업비전</a>
                        <a href="https://krb.co.kr/">기업연혁</a>
                        <a href="https://krb.co.kr/">CI소개</a>
                        <a href="https://krb.co.kr/">국내외 지사</a>
                        <a href="https://krb.co.kr/">수상실적</a>
                        <a href="https://krb.co.kr/">채용안내</a>
                        <a href="https://krb.co.kr/">찾아오시는 길</a>
                    </nav>
                </div>

                <div class="language">
                    <button type="button" aria-label="언어 선택" aria-expanded="false">
                        <span class="language-icon" aria-hidden="true">◎</span>
                        한국어
                        <span class="language-arrow" aria-hidden="true">⌄</span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <section class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="방방난방시스템" class="PC">
                            <img src="img/m_visual01.png" alt="모바일 방방난방시스템" class="Mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="따숨케어" class="PC">
                            <img src="img/m_visual02.png" alt="모바일 따숨케어" class="Mo">
                        </div>
                    </div>

                    <button type="button" class="swiper-button-prev" aria-label="이전 배너"></button>
                    <button type="button" class="swiper-button-next" aria-label="다음 배너"></button>

                    <div class="hero-controls">
                        <div class="swiper-pagination"></div>
                        <button type="button" class="swiper-autoplay" aria-label="배너 일시정지" aria-pressed="false">
                            <span class="pause-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },
            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
        });

        // Show the full submenu panel whenever the pointer enters the header.
        const header = document.querySelector('.header');
        const menuToggle = document.querySelector('.menu-toggle');
        const menuTriggers = document.querySelectorAll('.gnb-item > a[aria-controls]');
        const closeMegaMenu = () => header.classList.remove('mega-menu-open');

        header.addEventListener('mouseenter', () => {
            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                header.classList.add('mega-menu-open');
            }
        });

        header.addEventListener('mouseleave', closeMegaMenu);

        menuTriggers.forEach((trigger) => {
            trigger.addEventListener('click', (event) => {
                event.preventDefault();
                header.classList.add('mega-menu-open');
                trigger.setAttribute('aria-expanded', 'true');
            });
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeMegaMenu();
                header.classList.remove('menu-open');
                menuToggle.setAttribute('aria-expanded', 'false');
            }
        });

        menuToggle.addEventListener('click', () => {
            const isOpen = header.classList.toggle('menu-open');
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            menuToggle.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
            if (!isOpen) closeMegaMenu();
        });

        const autoplayButton = document.querySelector('.swiper-autoplay');

        autoplayButton.addEventListener('click', () => {
            if (swiper.autoplay.running) {
                swiper.autoplay.stop();
                autoplayButton.setAttribute('aria-label', '배너 재생');
                autoplayButton.setAttribute('aria-pressed', 'true');
                autoplayButton.classList.add('is-play');
            } else {
                swiper.autoplay.start();
                autoplayButton.setAttribute('aria-label', '배너 일시정지');
                autoplayButton.setAttribute('aria-pressed', 'false');
                autoplayButton.classList.remove('is-play');
            }
        });
    </script>
</body>
</html>
