<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        <title>버거킹 비밀번호 재설정 완료</title>
        <style>
            :root {
                --font: "Sandoll GothicNeoRound", sans-serif;
                --font-Pre: "Pretendard Variable", sans-serif;
                --font-BKR: "BKR", sans-serif;
                --primary: #512314;
                --text: #766053;
                --placeholder: #EBE6E2;
                --bg: #f4ebdc;
            }

            html { font-size: 62.5%; }

            body {
                font-family: var(--font);
                font-size: 1.6rem;
                color: var(--primary);
            }

            #wrap {
                width: 100%;
                max-width: 1024px;
                min-width: 360px;
                min-height: 100dvh;
                margin: 0 auto;
                background-color: var(--bg);
            }

            header {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 48px;
            }

            header h1 { font-size: 2rem; }

            .prev_btn {
                position: absolute;
                left: 0;
                width: 48px;
                height: 48px;
                background: transparent url(img/back_icon.svg) no-repeat center / auto;
            }

            main { padding: 48px 20px 90px; }

            .complete {
                text-align: center;
            }

            .complete_title {
                margin-bottom: 16px;
                font-family: var(--font-BKR);
                font-size: 3rem;
            }

            .complete_text {
                font-family: var(--font-Pre);
                font-size: 1.5rem;
                line-height: 1.7;
                color: var(--text);
            }

            .login_btn {
                display: block;
                width: 100%;
                height: 50px;
                margin-top: 32px;
                border-radius: 22px;
                font-family: inherit;
                font-size: inherit;
                color: var(--placeholder);
                background-color: var(--primary);
                text-align: center;
                line-height: 50px;
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <header>
                <h1>비밀번호 재설정</h1>
                <button type="button" class="prev_btn" onclick="history.back()">
                    <span class="sr-only">이전버튼</span>
                </button>
            </header>

            <main>
                <section class="complete">
                    <h2 class="complete_title">메일을 확인해 주세요</h2>
                    <p class="complete_text">
                        입력하신 이메일로<br>
                        비밀번호 재설정 안내를 보냈습니다.
                    </p>
                    <a href="login.html" class="login_btn">로그인으로 돌아가기</a>
                </section>
            </main>
        </div>
    </body>
</html>
