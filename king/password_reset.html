<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        <title>버거킹 비밀번호 재설정</title>
        <style>
            :root {
                --font: "Sandoll GothicNeoRound", sans-serif;
                --font-Pre: "Pretendard Variable", sans-serif;
                --font-BKR: "BKR", sans-serif;
                --primary: #512314;
                --baseBorder: #D9CFC6;
                --baseBg: #FFFCF9;
                --placeholder: #EBE6E2;
                --text: #766053;
                --bg: #f4ebdc;
            }

            html { font-size: 62.5%; }

            body {
                font-family: var(--font);
                font-size: 1.6rem;
                color: var(--primary);
            }

            #wrap {
                width: 100%;
                max-width: 1024px;
                min-width: 360px;
                min-height: 100dvh;
                margin: 0 auto;
                background-color: var(--bg);
            }

            header {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 48px;
            }

            header h1 { font-size: 2rem; }

            .prev_btn {
                position: absolute;
                left: 0;
                width: 48px;
                height: 48px;
                background: transparent url(img/back_icon.svg) no-repeat center / auto;
            }

            main { padding: 48px 20px 90px; }

            .title {
                display: flex;
                flex-direction: column;
                gap: 16px;
                margin-bottom: 50px;
                font-family: var(--font-BKR);
            }

            .title span:first-child { font-size: 2.5rem; }
            .title span:last-child { font-size: 3.5rem; }

            fieldset { width: 100%; }

            .form_label {
                display: block;
                margin-bottom: 8px;
                font-size: 1.5rem;
                line-height: 1;
            }

            .input_box input {
                display: block;
                width: 100%;
                height: 50px;
                padding: 0 20px;
                border: 1px solid var(--baseBorder);
                border-radius: 10px;
                background-color: var(--baseBg);
                font-family: inherit;
                font-size: inherit;
                color: inherit;
            }

            .input_box input::placeholder { color: var(--placeholder); }

            .help_text {
                margin-top: 10px;
                font-family: var(--font-Pre);
                font-size: 1.3rem;
                color: var(--text);
            }

            .reset_btn {
                width: 100%;
                height: 50px;
                margin-top: 24px;
                border-radius: 22px;
                font-family: inherit;
                font-size: inherit;
                color: var(--placeholder);
                background-color: var(--primary);
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <header>
                <h1>비밀번호 재설정</h1>
                <button type="button" class="prev_btn" onclick="history.back()">
                    <span class="sr-only">이전버튼</span>
                </button>
            </header>

            <main>
                <h2 class="title">
                    <span>비밀번호를</span>
                    <span>재설정해 주세요</span>
                </h2>

                <form>
                    <fieldset>
                        <legend class="sr-only">비밀번호 재설정</legend>
                        <label class="form_label" for="email">이메일</label>
                        <div class="input_box">
                            <input id="email" type="email" name="email"
                                placeholder="아이디(이메일)을 입력해 주세요." required>
                        </div>
                        <p class="help_text">가입하신 이메일로 비밀번호 재설정 안내를 보내드립니다.</p>
                        <button type="submit" class="reset_btn">재설정 메일 보내기</button>
                    </fieldset>
                </form>
            </main>
        </div>
    </body>
</html>
